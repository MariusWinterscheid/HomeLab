services:
  nginx-proxy-manager:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    network_mode: host
    environment:
      - DISABLE_IPV6=false # Setze dies auf true, falls dein Host kein IPv6 unterstützt
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt