services:
  nginx-proxy-manager:
    image: 'docker.io/jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    network_mode: host
    environment:
      - DISABLE_IPV6=false # Set to true if your host does not support IPv6
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt